{% extends "core/base.html" %}

{% block content %}

<style>
    .cart-container {
        max-width: 1000px;
        margin: 50px auto;
        padding: 20px;
    }

    .cart-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .cart-item {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 12px;
        background: #1f1f1f;
    }

    .cart-item img {
        width: 100px;
        height: 80px;
        object-fit: cover;
        border-radius: 10px;
        flex-shrink: 0;
    }

    .item-details {
        flex: 1;
    }

    .item-name {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    .item-price {
        color: #ccc;
    }

    .quantity-controls {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .quantity-controls button {
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 18px;
    }

    .quantity {
        min-width: 25px;
        text-align: center;
    }

    .remove-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 6px;
        cursor: pointer;
    }

    .cart-summary {
        margin-top: 30px;
        padding: 25px;
        border-radius: 12px;
        background: #1f1f1f;
    }

    .summary-line {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 17px;
    }

    .total-line {
        font-size: 21px;
        font-weight: bold;
        border-top: 1px solid #555;
        padding-top: 15px;
        margin-top: 15px;
    }

    .btn-main {
        display: block;
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #ffb703;
        color: #111;
        text-align: center;
        text-decoration: none;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-main:hover {
        opacity: 0.9;
    }

    .empty-cart {
        text-align: center;
        padding: 60px 20px;
        font-size: 20px;
    }

    @media (max-width: 700px) {
        .cart-item {
            flex-wrap: wrap;
        }

        .cart-item img {
            width: 80px;
            height: 70px;
        }

        .item-details {
            min-width: 150px;
        }
    }
</style>


<div class="cart-container">

    <h1 class="cart-title">🛒 Your Cart</h1>

    <!-- CART ITEMS -->
    <div id="cartItems"></div>

    <!-- CART SUMMARY -->
    <div class="cart-summary" id="cartSummary">

        <div class="summary-line">
            <span>Subtotal</span>
            <span id="subtotal">₹0</span>
        </div>

        <div class="summary-line">
            <span>Delivery</span>
            <span id="delivery">₹0</span>
        </div>

        <div class="summary-line total-line">
            <span>Total</span>
            <span id="total">₹0</span>
        </div>

        <a href="{% url 'checkout' %}"
           id="checkoutButton"
           class="btn-main">
            Proceed To Checkout
        </a>

    </div>

</div>


<script>

    // Get cart from localStorage
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const cartItemsContainer = document.getElementById("cartItems");
    const subtotalElement = document.getElementById("subtotal");
    const deliveryElement = document.getElementById("delivery");
    const totalElement = document.getElementById("total");
    const checkoutButton = document.getElementById("checkoutButton");


    function displayCart() {

        cartItemsContainer.innerHTML = "";

        // Empty cart
        if (cart.length === 0) {

            cartItemsContainer.innerHTML = `
                <div class="empty-cart">
                    <p>Your cart is empty 🥞</p>
                    <a href="{% url 'menu' %}" class="btn-main">
                        Go To Menu
                    </a>
                </div>
            `;

            subtotalElement.innerText = "₹0";
            deliveryElement.innerText = "₹0";
            totalElement.innerText = "₹0";

            checkoutButton.style.pointerEvents = "none";
            checkoutButton.style.opacity = "0.5";

            return;
        }


        // Enable checkout
        checkoutButton.style.pointerEvents = "auto";
        checkoutButton.style.opacity = "1";


        let subtotal = 0;


        // Display every cart item
        cart.forEach(function(item, index) {

            const quantity = Number(item.qty) || 1;
            const price = Number(item.price) || 0;

            const itemTotal = price * quantity;

            subtotal += itemTotal;


            // Use the image stored in localStorage
            const imageUrl = item.image || "";


            cartItemsContainer.innerHTML += `

                <div class="cart-item">

                    <img
                        src="${imageUrl}"
                        alt="${item.name}"
                        onerror="this.style.display='none';"
                    >

                    <div class="item-details">

                        <div class="item-name">
                            ${item.name}
                        </div>

                        <div class="item-price">
                            ₹${price}
                        </div>

                    </div>


                    <div class="quantity-controls">

                        <button
                            type="button"
                            onclick="decreaseQuantity(${index})">
                            −
                        </button>

                        <span class="quantity">
                            ${quantity}
                        </span>

                        <button
                            type="button"
                            onclick="increaseQuantity(${index})">
                            +
                        </button>

                    </div>


                    <div>
                        ₹${itemTotal}
                    </div>


                    <button
                        type="button"
                        class="remove-btn"
                        onclick="removeItem(${index})">
                        Remove
                    </button>

                </div>
            `;
        });


        // Delivery charge
        const delivery = 40;

        const total = subtotal + delivery;


        subtotalElement.innerText = "₹" + subtotal;
        deliveryElement.innerText = "₹" + delivery;
        totalElement.innerText = "₹" + total;
    }


    // Increase quantity
    function increaseQuantity(index) {

        cart[index].qty = (Number(cart[index].qty) || 1) + 1;

        saveCart();
    }


    // Decrease quantity
    function decreaseQuantity(index) {

        const currentQuantity = Number(cart[index].qty) || 1;

        if (currentQuantity > 1) {

            cart[index].qty = currentQuantity - 1;

        } else {

            cart.splice(index, 1);

        }

        saveCart();
    }


    // Remove item
    function removeItem(index) {

        cart.splice(index, 1);

        saveCart();
    }


    // Save cart
    function saveCart() {

        localStorage.setItem("cart", JSON.stringify(cart));

        displayCart();
    }


    // Initial display
    displayCart();

</script>

{% endblock %}
