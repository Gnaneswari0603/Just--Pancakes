{% extends 'core/base.html' %}

{% block content %}

<style>
.success-box {
    background: #1c1c1c;
    border-radius: 15px;
    padding: 40px;
    text-align: center;
    margin-top: 80px;
    animation: fadeIn 0.6s ease-in-out;
}

.success-icon {
    font-size: 60px;
    color: #28a745;
}

.btn-main {
    background: linear-gradient(45deg, #ffc107, #ff9800);
    border: none;
    color: black;
    padding: 10px 20px;
    border-radius: 25px;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>

<div class="container d-flex justify-content-center">
    <div class="success-box col-md-6">

        <div class="success-icon">✔</div>

        <h2 class="mt-3">Order Placed Successfully!</h2>
        <p class="mt-2">Thank you for ordering from <strong>Just Pancakes</strong> 🥞</p>

        <hr>

        <!-- OPTIONAL: Order Details -->
        {% if order %}
        <p><strong>Order ID:</strong> #{{ order.id }}</p>
        <p><strong>Total Paid:</strong> ₹{{ order.total }}</p>
        {% endif %}

        <div class="mt-4">
            <a href="{% url 'menu' %}" class="btn btn-main">
                Back to Menu
            </a>
        </div>

    </div>
</div>

{% endblock %}
