{% extends "core/base.html" %}

{% block content %}

<style>
    .checkout-container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 20px;
    }

    .checkout-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .checkout-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .checkout-box {
        background: #1f1f1f;
        padding: 25px;
        border-radius: 12px;
    }

    .checkout-box h3 {
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border: 1px solid #555;
        border-radius: 7px;
        background: #2b2b2b;
        color: white;
    }

    .form-group textarea {
        min-height: 110px;
        resize: vertical;
    }

    .summary-line {
        display: flex;
        justify-content: space-between;
        margin-bottom: 14px;
    }

    .total-line {
        border-top: 1px solid #555;
        padding-top: 15px;
        margin-top: 15px;
        font-size: 21px;
        font-weight: bold;
    }

    .btn-main {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        background: #ffb703;
        color: #111;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .btn-main:hover {
        opacity: 0.9;
    }

    .btn-main:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .empty-cart {
        text-align: center;
        padding: 30px;
    }

    .empty-cart a {
        color: #ffb703;
    }

    .error-message {
        background: #842029;
        color: white;
        padding: 12px;
        border-radius: 7px;
        margin-bottom: 20px;
    }

    .order-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #444;
    }

    @media (max-width: 768px) {
        .checkout-layout {
            grid-template-columns: 1fr;
        }
    }
</style>


<div class="checkout-container">

    <h1 class="checkout-title">
        🧾 Secure Checkout
    </h1>


    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}


    <div class="checkout-layout">


        <!-- CUSTOMER DETAILS -->

        <div class="checkout-box">

            <h3>
                Customer Details
            </h3>

            <form method="POST" id="checkoutForm">

                {% csrf_token %}


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        placeholder="Enter your complete delivery address"
                        required
                    ></textarea>

                </div>


                <!-- CART DATA -->

                <input
                    type="hidden"
                    name="cart_data"
                    id="cartData"
                >


                <button
                    type="submit"
                    class="btn-main"
                    id="placeOrderButton">

                    Place Order 🚀

                </button>

            </form>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="checkout-box">

            <h3>
                Order Summary
            </h3>


            <div id="checkoutItems">
            </div>


            <div class="summary-line">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    ₹0
                </span>

            </div>


            <div class="summary-line">

                <span>
                    Delivery
                </span>

                <span id="delivery">
                    ₹0
                </span>

            </div>


            <div class="summary-line total-line">

                <span>
                    Total
                </span>

                <span id="total">
                    ₹0
                </span>

            </div>

        </div>

    </div>

</div>


<script>

    // =========================================
    // GET CART
    // =========================================

    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    // =========================================
    // HTML ELEMENTS
    // =========================================

    const checkoutItems =
        document.getElementById("checkoutItems");

    const subtotalElement =
        document.getElementById("subtotal");

    const deliveryElement =
        document.getElementById("delivery");

    const totalElement =
        document.getElementById("total");

    const cartDataInput =
        document.getElementById("cartData");

    const placeOrderButton =
        document.getElementById("placeOrderButton");


    // =========================================
    // LOAD CART
    // =========================================

    function loadCheckout() {

        checkoutItems.innerHTML = "";


        // Empty cart

        if (cart.length === 0) {

            checkoutItems.innerHTML = `

                <div class="empty-cart">

                    <p>
                        Your cart is empty 🥞
                    </p>

                    <a href="{% url 'menu' %}">
                        Go to Menu
                    </a>

                </div>

            `;

            subtotalElement.innerText = "₹0";
            deliveryElement.innerText = "₹0";
            totalElement.innerText = "₹0";

            placeOrderButton.disabled = true;

            cartDataInput.value = "";

            return;
        }


        // Enable button

        placeOrderButton.disabled = false;


        let subtotal = 0;


        // =====================================
        // DISPLAY PRODUCTS
        // =====================================

        cart.forEach(function(item) {

            const quantity =
                Number(item.qty) || 1;

            const price =
                Number(item.price) || 0;

            const itemTotal =
                price * quantity;


            subtotal += itemTotal;


            checkoutItems.innerHTML += `

                <div class="order-item">

                    <span>
                        ${item.name} × ${quantity}
                    </span>

                    <span>
                        ₹${itemTotal}
                    </span>

                </div>

            `;

        });


        // =====================================
        // DELIVERY
        // =====================================

        const delivery = 40;


        // =====================================
        // TOTAL
        // =====================================

        const total =
            subtotal + delivery;


        subtotalElement.innerText =
            "₹" + subtotal;

        deliveryElement.innerText =
            "₹" + delivery;

        totalElement.innerText =
            "₹" + total;


        // Send cart to Django

        cartDataInput.value =
            JSON.stringify(cart);

    }


    // =========================================
    // FORM SUBMIT
    // =========================================

    document
        .getElementById("checkoutForm")
        .addEventListener(
            "submit",
            function(event) {

                // Get latest cart

                cart =
                    JSON.parse(
                        localStorage.getItem("cart")
                    ) || [];


                if (cart.length === 0) {

                    event.preventDefault();

                    alert(
                        "Your cart is empty."
                    );

                    return;
                }


                // Send cart data

                cartDataInput.value =
                    JSON.stringify(cart);

            }
        );


    // =========================================
    // START
    // =========================================

    loadCheckout();

</script>

{% endblock %}
